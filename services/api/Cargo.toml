[package]
name = "rusttalk-api"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio", "ws"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "zeroize"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
livekit-api = { version = "=0.10.2", default-features = false, features = ["webhooks"] }
livekit-protocol = "=0.8.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusttalk-core = { path = "../../crates/core", features = ["https-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tempfile = "3"
zeroize = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["limit", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
# Paused time, so retry delays can be tested without waiting.
tokio = { version = "1", features = ["test-util"] }
