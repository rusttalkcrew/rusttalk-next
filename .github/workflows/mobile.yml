name: Mobile apps

# Builds a test Android APK and an unsigned iOS IPA from the client's code, so a pull
# request that touches the client proves the phone builds still work (docs/mobile.md).
# Hosted Mac runners are scarce (#479), so pull requests build only Android here; iOS
# runs from ios.yml (iOS changes, nightly). Run it by hand from the Actions tab for
# test builds of any branch.
on:
  pull_request:
    paths:
      - crates/client/**
      - crates/core/**
      - deploy/android/**
      - deploy/ios/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/mobile.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      ios-only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces a pull request's run; release and manual runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MOBILE_BUILD: ${{ inputs.release && 'release' || 'test' }}

jobs:
  android:
    if: ${{ !inputs.ios-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add aarch64-linux-android
      # The NDK release the build is tested with; the runner's default one changes.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" deploy/android/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-${{ inputs.release && 'unsigned' || 'test' }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    if: ${{ github.event_name != 'pull_request' || inputs.ios-only }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add aarch64-apple-ios
      - run: deploy/ios/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 7
