[workspace]
resolver = "3"
members = ["crates/*", "services/*"]
# Vendored from crates.io with a small patch (see its README); not our code to lint.
exclude = ["crates/smithay-clipboard"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "Apache-2.0"

# The desktop client runs in dev builds too. Keep the model's hot loops optimized.
[profile.dev.package.deep-filter-rt]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
# Unlocking a password key file takes seconds without optimisation.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# egui's Wayland clipboard, patched to take file drops too: winit 0.30 has no Wayland
# drag and drop, and compositors such as Hyprland offer a drag to only one data device
# per app, so it has to be this one. Remove once winit delivers Wayland file drops.
[patch.crates-io]
smithay-clipboard = { path = "crates/smithay-clipboard" }
