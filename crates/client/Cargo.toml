[package]
name = "rusttalk-client"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = "0.37"
# Bundled emoji glyphs, so icons and chat emoji render without system fonts.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
etcetera = "0.11"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusttalk-core = { path = "../core", features = ["client"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
zeroize = "1"
