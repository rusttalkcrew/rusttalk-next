[package]
name = "rusttalk-client"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
# Turns a key-storage password into a key (Argon2id).
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# Pictures pasted from web pages as data: addresses.
base64 = "0.22"
# Locks the key file of the "File with password" key storage.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The PulseAudio protocol (also served by PipeWire) gives real device names on Linux;
# ALSA stays the fallback. Not cpal's PipeWire host: WebRTC's own PipeWire stubs shadow it.
cpal = { version = "0.18", features = ["pulseaudio"] }
# DeepFilterNet3 noise removal (tract, pure Rust); its weights are downloaded on request.
deep-filter-rt = "0.2"
rtrb = "0.3"
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast"] }
# Desktops add the default features below. Their `wayland` feature makes arboard
# build Wayland's clipboard on iOS, which arboard counts as a Linux-like system.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "links", "system_fonts", "wgpu"] }
# Bundled emoji glyphs, so icons and chat emoji render without system fonts.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
etcetera = "0.11"
# Unpacks the downloaded DeepFilterNet model archive.
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
# Crops and re-encodes picked profile pictures and server icons.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
livekit = "=0.11.0"
# The frames DeepFilterNet takes.
ndarray = "0.17"
# Opens saved files and their folders in the system's apps.
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rusttalk-core = { path = "../core", features = ["client", "voice", "capture"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
# The computer's language, for the "System" language choice (already used by eframe).
sys-locale = "0.3"
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-segmentation = "1"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = "1"
notify-rust = "4.19"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
linkify = "0.10"
regex = "1"
html5ever = "0.40.1"
# System-wide shortcuts on Windows, macOS and X11; Wayland goes through the desktop portal.
global-hotkey = "0.10"
# The pseudo terminal a shared shell runs in (ConPTY on Windows).
portable-pty = "0.9"
# The terminal emulator a shared terminal is replayed in, on both sides.
alacritty_terminal = { version = "0.26", default-features = false }
# How wide a letter is, to limit the combining marks a viewer's terminal takes.
unicode-width = "0.2"

[build-dependencies]
# Compiles the iPhone's AVFoundation delegate.
cc = "1"

[target.'cfg(windows)'.build-dependencies]
# Compiles rusttalk.rc so Windows shows the app icon on the executable.
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
# statvfs, to match the AppImage mount against the AppImage file before an update;
# renamex_np, to swap the macOS app bundle for its update in one step; and ending a
# shared shell's process group.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Global shortcuts on Wayland, through the desktop's portal.
ashpd = { version = "=0.14.0", default-features = false, features = ["global_shortcuts", "tokio"] }
# Wayland file drops: our window's surface, and egui's clipboard patched to take
# drags (see the workspace Cargo.toml).
raw-window-handle = "0.6"
smithay-clipboard = "0.7"
# Pasting: the window reads only text, these read any format the copying app offers.
wl-clipboard-rs = "0.9"
x11-clipboard = "0.9"
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
# Pasting: the pasteboard's picture formats and copied files, and TIFF as PNG.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImageRep", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSDictionary", "NSError", "NSString"] }
# Notifications whose click opens the chat (see src/notify/macos.rs).
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# Desktop-only: phones have none of these, or need their own (see docs/mobile.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Phone calls: G.722 wideband sound (src/phone/codec.rs). MIT, pure Rust; without the
# default Opus and G.729 (C code) features.
audio-codec = { version = "0.4.14", default-features = false, features = ["std"] }
eframe = { version = "0.37", features = ["default"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
# Phone calls into a voice room (src/phone): SIP signalling over UDP. MIT. No TLS,
# WebSocket or SRV lookup, so it adds no second rustls setup or DNS resolver.
rsipstack = { version = "0.8.7", default-features = false, features = ["platform-tokio"] }
tokio-util = "0.7"

[target.'cfg(target_os = "android")'.dependencies]
# Android starts the app through GameActivity: it has the on-screen keyboard and
# AccessKit that NativeActivity lacks (see docs/mobile.md).
eframe = { version = "0.37", features = ["android-game-activity", "glow"] }
winit = { version = "0.30", default-features = false }
# Window insets and the activity's state; the version android-activity already uses.
jni = "0.22"
# LiveKit's Android initializer takes JNI 0.21 types.
livekit-jni = { package = "jni", version = "0.21" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionRoute", "AVAudioSessionTypes", "block2"] }
# The data-protection Keychain for the keys (keystore.rs `IosKeychain`); keyring's
# `v1` API has no iOS store.
apple-native-keyring-store = { version = "1", features = ["protected"] }
# Keeps the settings folder, with the key file, out of iCloud and computer backups.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSDictionary", "NSEnumerator", "NSNotification", "NSOperation", "block2", "NSError", "NSString", "NSURL", "NSValue"] }
# The system clipboard (UIPasteboard) and drawing inside the safe area (src/ios.rs);
# the versions winit, egui-winit and wgpu already use.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CATransaction"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-quartz-core", "UIApplication", "UIColor", "UIGeometry", "UIKeyboardLayoutGuide", "UILayoutGuide", "UIPasteboard", "UIResponder", "UIScreen", "UITrackingLayoutGuide", "UIView", "UIViewController", "UIWindow"] }
# The status bar's text colour (src/ios.rs); the version eframe already uses.
winit = { version = "0.30", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Clearing copied recovery words: read and emptied in one step (src/words.rs). Already
# built for egui's clipboard.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
# Pasting: registered picture formats and copied files, and bitmaps as a last resort.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
clipboard-win = "5.4"
# A job object, so a shared shell's processes end with the share.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# Drives the window off-screen, to click rows and buttons in tests.
egui_kittest = "0.37"
