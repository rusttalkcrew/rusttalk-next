[package]
name = "rusttalk-bot"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
livekit = "=0.11.0"
livekit-api = { version = "=0.10.2", default-features = false, features = ["access-token"] }
rustls-pki-types = "1"
rusttalk-core = { path = "../core", features = ["livekit-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
