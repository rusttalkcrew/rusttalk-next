[package]
name = "rusttalk-bot"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "rusttalk-bot"
required-features = ["media"]

[features]
default = ["media"]
media = ["dep:clap", "dep:livekit", "dep:tracing", "dep:tracing-subscriber", "dep:futures-util", "rusttalk-core/voice", "rusttalk-core/capture", "dep:tempfile"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
livekit = { version = "=0.11.0", optional = true }
rustls-pki-types = "1"
rusttalk-core = { path = "../core", features = ["client"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

tempfile = { version = "3", optional = true }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = "1"
