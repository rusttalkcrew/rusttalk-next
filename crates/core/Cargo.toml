[package]
name = "rusttalk-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
base64 = "0.22"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "chacha", "x25519"] }
bip39 = { version = "3", features = ["zeroize"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "zeroize"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
hkdf = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
livekit = { version = "=0.11.0", optional = true }
livekit-net = { version = "=0.2.0", optional = true }
livekit-protocol = { version = "=0.8.3", optional = true }
prost = { version = "0.14", optional = true }
rand = { version = "0.10", default-features = false, features = ["alloc", "std_rng", "sys_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"], optional = true }
tracing = { version = "0.1", optional = true }
url = { version = "2", features = ["serde"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
wasapi = { version = "=0.27.0", optional = true }
windows-capture = { version = "=2.0.1", optional = true }
windows = { version = "0.62.2", features = ["Wdk_System_SystemServices", "Win32_System_Threading", "Win32_System_SystemInformation"], optional = true }

[features]
client = ["dep:anyhow", "dep:image", "dep:futures-util", "dep:reqwest", "reqwest/json", "dep:rustls", "dep:serde_json", "dep:tempfile", "dep:tokio", "dep:tokio-tungstenite", "dep:tracing"]
livekit-tls = ["dep:async-trait", "dep:futures-util", "dep:livekit-net", "dep:livekit-protocol", "dep:prost", "dep:reqwest", "dep:rustls", "dep:tokio", "dep:tokio-tungstenite"]
capture = ["dep:anyhow", "dep:serde_json", "dep:tracing", "dep:wasapi", "dep:windows"]
voice = ["client", "livekit-tls", "dep:livekit", "dep:windows-capture", "tokio/io-util", "tokio/process", "tokio/rt"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
