[package]
name = "rusttalk-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
livekit-net = { version = "=0.2.0", optional = true }
livekit-protocol = { version = "=0.8.3", optional = true }
prost = { version = "0.14", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["net", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["__rustls-tls"], optional = true }
url = { version = "2", optional = true }

[features]
livekit-tls = ["dep:async-trait", "dep:futures-util", "dep:livekit-net", "dep:livekit-protocol", "dep:prost", "dep:reqwest", "dep:rustls", "dep:sha2", "dep:tokio", "dep:tokio-tungstenite", "dep:url"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
