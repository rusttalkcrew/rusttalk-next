[package]
name = "rusttalk-core"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
base64 = "0.22"
boringtun = { version = "0.7.1", default-features = false, optional = true }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "chacha", "x25519"] }
bip39 = { version = "3", features = ["zeroize"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "zeroize"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
hkdf = "0.12"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"], optional = true }
jpeg-decoder = { version = "0.3.2", default-features = false, optional = true }
livekit = { version = "=0.11.0", optional = true }
livekit-net = { version = "=0.2.0", optional = true }
livekit-protocol = { version = "=0.8.3", optional = true }
prost = { version = "0.14", optional = true }
rand = { version = "0.10", default-features = false, features = ["alloc", "std_rng", "sys_rng"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "proto-dns", "socket-tcp", "socket-udp", "socket-dns", "dns-max-name-size-255"], optional = true }
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }
url = { version = "2", features = ["serde"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "1"
mime_guess = { version = "2.0.5", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["event", "net", "time"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
wayland-protocols-misc = { version = "0.3", features = ["client"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
xkbcommon = { version = "0.8", default-features = false, optional = true }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-v4l"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-avfoundation"], optional = true }
# Lists camera modes; nokhwa's own list is always empty on macOS (see camera.rs).
nokhwa-bindings-macos = { version = "=0.2.4", optional = true }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true }
objc2 = { version = "0.6", optional = true }
# The frontmost app, so remote keys only reach a shared window that is in front, and
# the names of apps playing sound.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"], optional = true }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "block2", "dispatch2", "objc2", "objc2-core-audio-types", "objc2-foundation"], optional = true }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"], optional = true }
objc2-core-foundation = { version = "0.3", optional = true }
objc2-core-graphics = { version = "0.3", optional = true }
objc2-core-media = { version = "0.3", optional = true }
objc2-core-video = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-screen-capture-kit = { version = "0.3", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"], optional = true }

# No camera backend yet: listing cameras fails with "no backend", so calls go without.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
nokhwa = { version = "0.10.11", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"], optional = true }
wasapi = { version = "=0.27.0", optional = true }
windows-capture = { version = "=2.0.1", optional = true }
windows = { version = "0.62.2", features = ["Wdk_System_SystemServices", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"], optional = true }

[features]
https-client = ["dep:reqwest", "dep:rustls", "reqwest/http2"]
client = ["dep:anyhow", "dep:boringtun", "dep:image", "dep:jpeg-decoder", "dep:futures-util", "https-client", "reqwest/json", "reqwest/socks", "reqwest/stream", "dep:serde_json", "dep:smoltcp", "dep:tempfile", "dep:tokio", "tokio/io-util", "tokio/macros", "tokio/rt", "dep:tokio-tungstenite", "dep:tracing"]
livekit-tls = ["dep:async-trait", "dep:futures-util", "dep:livekit-net", "dep:livekit-protocol", "dep:prost", "dep:reqwest", "dep:rustls", "dep:tokio", "dep:tokio-tungstenite"]
capture = ["dep:anyhow", "dep:serde_json", "dep:tracing", "dep:wasapi", "dep:windows", "dep:block2", "dep:dispatch2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-core-audio", "dep:objc2-core-audio-types", "dep:objc2-core-foundation", "dep:objc2-foundation"]
voice = ["dep:rustix", "dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-misc", "dep:wayland-protocols-wlr", "dep:xkbcommon", "client", "livekit-tls", "dep:image", "dep:livekit", "dep:mime_guess", "dep:nokhwa", "dep:nokhwa-bindings-macos", "dep:block2", "dep:dispatch2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-core-foundation", "dep:objc2-core-graphics", "dep:objc2-core-media", "dep:objc2-core-video", "dep:objc2-foundation", "dep:objc2-screen-capture-kit", "dep:windows", "dep:windows-capture", "tokio/fs", "tokio/io-util", "tokio/process", "tokio/rt"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
