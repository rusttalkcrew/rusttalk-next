services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      LIVEKIT_API_KEY: rusttalk-dev
      LIVEKIT_API_SECRET: dev-only-livekit-secret-do-not-deploy
    volumes:
      - api-data:/data
    develop:
      watch:
        - action: rebuild
          path: ../services/api
        - action: rebuild
          path: ../crates/core
        - action: rebuild
          path: ..
          include: "Cargo.*"

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      NODE_IP: "${NODE_IP:-127.0.0.1}"
    volumes:
      - ./livekit.dev.yml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 3s
      timeout: 2s
      retries: 10

  cert:
    image: alpine/openssl:3.5.9
    user: "${RUSTTALK_DEV_USER:-0:0}"
    volumes:
      - ${RUSTTALK_DEV_DATA:-../.dev}:/dev-data
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cd /dev-data
        if [ ! -d tls ]; then
          umask 077
          tmp=$$(mktemp -d tls.XXXXXX)
          trap 'rm -rf "$$tmp"' EXIT
          openssl req -quiet -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -noenc \
            -days 3650 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$$tmp/key.pem" -out "$$tmp/cert.pem"
          mv -T "$$tmp" tls
        fi
        test -s tls/cert.pem && test -s tls/key.pem

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      api:
        condition: service_started
      livekit:
        condition: service_healthy
      cert:
        condition: service_completed_successfully
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ${RUSTTALK_DEV_DATA:-../.dev}:/dev-data:ro
    ports:
      - "8443:8443/tcp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/dev-data/tls/cert.pem", "https://127.0.0.1:8443/v1/health"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  api-data:
