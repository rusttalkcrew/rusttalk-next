services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      LIVEKIT_API_KEY: rusttalk-dev
      LIVEKIT_API_SECRET: dev-only-livekit-secret-do-not-deploy
      RUSTTALK_DEV: "1"
      RUSTTALK_DEV_SESSION_TTL_SECS: "${RUSTTALK_DEV_SESSION_TTL_SECS:-}"
      RUSTTALK_FILE_MAX_BYTES: "${RUSTTALK_FILE_MAX_BYTES:-33554432}"
      RUSTTALK_FILE_MEMBER_BYTES: "${RUSTTALK_FILE_MEMBER_BYTES:-524288000}"
      RUSTTALK_FILE_SERVER_BYTES: "${RUSTTALK_FILE_SERVER_BYTES:-5368709120}"
      RUSTTALK_FILE_TTL_SECS: "${RUSTTALK_FILE_TTL_SECS:-2592000}"
    volumes:
      - api-data:/data
    develop:
      watch:
        - action: rebuild
          path: ../services/api
        - action: rebuild
          path: ../crates/core
        - action: rebuild
          path: ..
          include: "Cargo.*"

  index:
    profiles: ["index"]
    build:
      context: ..
      dockerfile: services/index/Dockerfile
    environment:
      RUSTTALK_INDEX_TRUST_PROXY: "1"
      RUSTTALK_INDEX_TTL_SECONDS: "${RUSTTALK_INDEX_TTL_SECONDS:-10800}"
    volumes:
      - index-data:/data

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      NODE_IP: "${NODE_IP:-127.0.0.1}"
      LIVEKIT_RTC_TCP_PORT: "${RUSTTALK_DEV_MEDIA_TCP_PORT:-7881}"
      UDP_PORT: "${RUSTTALK_DEV_MEDIA_UDP_PORT:-7882}"
    volumes:
      - ./livekit.dev.yml:/etc/livekit.yaml:ro
    ports:
      - "${RUSTTALK_DEV_MEDIA_TCP_PORT:-7881}:${RUSTTALK_DEV_MEDIA_TCP_PORT:-7881}/tcp"
      - "${RUSTTALK_DEV_MEDIA_UDP_PORT:-7882}:${RUSTTALK_DEV_MEDIA_UDP_PORT:-7882}/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 3s
      timeout: 2s
      retries: 10

  cert:
    image: alpine/openssl:3.5.9
    user: "${RUSTTALK_DEV_USER:-0:0}"
    volumes:
      - ${RUSTTALK_DEV_DATA:-../.dev}:/dev-data
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cd /dev-data
        if [ ! -d tls ]; then
          umask 077
          tmp=$$(mktemp -d tls.XXXXXX)
          trap 'rm -rf "$$tmp"' EXIT
          openssl req -quiet -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -noenc \
            -days 3650 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$$tmp/key.pem" -out "$$tmp/cert.pem"
          mv -T "$$tmp" tls
        fi
        test -s tls/cert.pem && test -s tls/key.pem

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      api:
        condition: service_started
      livekit:
        condition: service_healthy
      cert:
        condition: service_completed_successfully
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ${RUSTTALK_DEV_DATA:-../.dev}:/dev-data:ro
    ports:
      - "${RUSTTALK_DEV_HTTPS_PORT:-8443}:8443/tcp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/dev-data/tls/cert.pem", "https://127.0.0.1:8443/v1/health"]
      interval: 3s
      timeout: 2s
      retries: 10

volumes:
  api-data:
  index-data:
