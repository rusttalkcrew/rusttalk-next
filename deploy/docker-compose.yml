# Production stack. Copy .env.example to .env next to this file, fill it in, then:
#   docker compose -f deploy/docker-compose.yml up -d --wait
# See docs/operations.md#production.
name: rusttalk

services:
  api:
    image: ${RUSTTALK_IMAGE_PREFIX:-}rusttalk-api:${RUSTTALK_VERSION:?set RUSTTALK_VERSION in deploy/.env}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: api
      args:
        SERVICE: api
    restart: unless-stopped
    labels: &auto-update
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      LIVEKIT_API_KEY: rusttalk
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in deploy/.env}"
      RUSTTALK_FILE_MAX_BYTES: "${RUSTTALK_FILE_MAX_BYTES:-33554432}"
      RUSTTALK_FILE_MEMBER_BYTES: "${RUSTTALK_FILE_MEMBER_BYTES:-524288000}"
      RUSTTALK_FILE_SERVER_BYTES: "${RUSTTALK_FILE_SERVER_BYTES:-5368709120}"
      RUSTTALK_FILE_TTL_SECS: "${RUSTTALK_FILE_TTL_SECS:-2592000}"
      RUSTTALK_EMOJI_MAX: "${RUSTTALK_EMOJI_MAX:-100}"
      RUSTTALK_STICKER_MAX: "${RUSTTALK_STICKER_MAX:-50}"
      RUSTTALK_EMOJI_MAX_BYTES: "${RUSTTALK_EMOJI_MAX_BYTES:-262144}"
    volumes:
      - api-data:/data

  index:
    profiles: ["index"]
    image: ${RUSTTALK_IMAGE_PREFIX:-}rusttalk-index:${RUSTTALK_VERSION:?set RUSTTALK_VERSION in deploy/.env}
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: index
      args:
        SERVICE: index
    restart: unless-stopped
    labels: *auto-update
    environment:
      RUSTTALK_INDEX_TRUST_PROXY: "1"
    volumes:
      - index-data:/data

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "rusttalk: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in deploy/.env}"
      NODE_IP: "${RUSTTALK_IP:?set RUSTTALK_IP in deploy/.env}"
      LIVEKIT_RTC_TCP_PORT: "${RUSTTALK_MEDIA_TCP_PORT:-7881}"
      UDP_PORT: "${RUSTTALK_MEDIA_UDP_PORT:-7882}"
    volumes:
      - ./livekit.yml:/etc/livekit.yaml:ro
    ports:
      - "${RUSTTALK_MEDIA_TCP_PORT:-7881}:${RUSTTALK_MEDIA_TCP_PORT:-7881}/tcp"
      - "${RUSTTALK_MEDIA_UDP_PORT:-7882}:${RUSTTALK_MEDIA_UDP_PORT:-7882}/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 30s
      start_interval: 2s

  # Without RUSTTALK_DOMAIN: creates a self-signed certificate once and keeps it
  # in caddy-data, so the pin in invites stays valid across restarts and upgrades.
  # With RUSTTALK_DOMAIN: Caddy gets a Let's Encrypt certificate instead.
  cert:
    image: alpine/openssl:3.5.9
    environment:
      RUSTTALK_DOMAIN: "${RUSTTALK_DOMAIN:-}"
      RUSTTALK_IP: "${RUSTTALK_IP:?set RUSTTALK_IP in deploy/.env}"
    volumes:
      - caddy-data:/data
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cd /data
        if [ -n "$$RUSTTALK_DOMAIN" ]; then
          echo '# Automatic HTTPS for RUSTTALK_DOMAIN' > rusttalk-tls.caddy
          echo "TLS: Let's Encrypt for $$RUSTTALK_DOMAIN"
          exit 0
        fi
        if [ ! -d rusttalk-tls ]; then
          umask 077
          tmp=$$(mktemp -d rusttalk-tls.XXXXXX)
          trap 'rm -rf "$$tmp"' EXIT
          openssl req -quiet -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -noenc \
            -days 36500 -subj "/CN=$$RUSTTALK_IP" -addext "subjectAltName=IP:$$RUSTTALK_IP" \
            -keyout "$$tmp/key.pem" -out "$$tmp/cert.pem"
          mv -T "$$tmp" rusttalk-tls
        fi
        echo 'tls /data/rusttalk-tls/cert.pem /data/rusttalk-tls/key.pem' > rusttalk-tls.caddy
        pin=$$(openssl x509 -in rusttalk-tls/cert.pem -outform DER | openssl dgst -sha256 -binary |
          openssl base64 -A | tr '/+' '_-' | tr -d '=')
        echo "TLS: self-signed $$(openssl x509 -in rusttalk-tls/cert.pem -noout -sha256 -fingerprint)"
        echo "TLS pin: $$pin"

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      livekit:
        condition: service_healthy
      cert:
        condition: service_completed_successfully
    environment:
      RUSTTALK_SITE: "${RUSTTALK_DOMAIN:-:443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "${RUSTTALK_HTTP_PORT:-80}:80/tcp"
      - "${RUSTTALK_HTTPS_PORT:-443}:443/tcp"
    healthcheck:
      # Loopback liveness only: -k because the name check happens in the clients.
      test: ["CMD", "curl", "-fsSk", "--connect-to", "::127.0.0.1:443", "https://${RUSTTALK_DOMAIN:-127.0.0.1}/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # Optional, off unless started with `--profile auto-update`. Pulls new images
  # for the services labelled above (api, index) only, so RUSTTALK_VERSION should
  # be <major>.<minor> (for example 0.1) to follow patch releases. It does not back
  # up or roll back. See docs/operations.md#automatic-updates.
  updater:
    profiles: ["auto-update"]
    image: ghcr.io/nicholas-fedor/watchtower:1.24.1
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      # Six fields (seconds first), server local time. Default: daily at 04:00.
      WATCHTOWER_SCHEDULE: "${RUSTTALK_UPDATE_SCHEDULE:-0 0 4 * * *}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  api-data:
  index-data:
  caddy-data:
